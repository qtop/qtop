<html>

<head>

<script>

function update() {
    fetch("api.json", {cache: "no-store"})
        .then(function (response) { return response.json(); })
        .then(function (data) { document.getElementById("info").textContent = JSON.stringify(data, null, "\t"); })
        .catch(function () {})
        .then(function () { setTimeout(update, 1000); });
}

document.addEventListener("DOMContentLoaded", update);

</script>

</head>
<body>


<h1>Qtop</h1>

<pre id="info">

</pre>


</body>
</html>
