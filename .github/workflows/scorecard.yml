# OpenSSF Scorecard (#488): supply-chain health checks on the repository
# itself. Publishes results to the OpenSSF API (badge + scorecard.dev
# viewer), uploads the SARIF to GitHub code scanning, and keeps a copy as
# a workflow artifact. Baseline measured via the public Scorecard REST API
# on 2026-06-08: score 7.1, with SAST, Security-Policy, CII-Best-Practices
# and Fuzzing as the obvious uplift candidates (see
# docs/secure-coding-pyscg.md for the gap-to-action mapping).
#
# The GitLab twin (ci/scorecard.gitlab-ci.yml) runs the scorecard CLI on a
# schedule against the same GitHub repository, so a pegged mirror reports
# the same numbers.

name: scorecard-qtop

on:
  schedule:
    - cron: '20 5 * * 6'
  push:
    branches:
      - main
      # Non-default branches use the commit-specific CLI job below.
      - develop
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # The action rejects non-default branches even without publishing.
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif

  branch-analysis:
    name: scorecard branch analysis
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Scan the branch commit
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
          SCORECARD_REPO: github.com/${{ github.repository }}
          SCORECARD_COMMIT: ${{ github.sha }}
        run: make scorecard-scan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scorecard-branch
          path: artifacts/scorecard/
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: artifacts/scorecard/scorecard.sarif
          category: scorecard-branch
