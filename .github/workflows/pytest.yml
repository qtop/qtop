name: pytest-qtop

on:
  push:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pytest
      - run: make fortifications
      - run: python -m pytest
