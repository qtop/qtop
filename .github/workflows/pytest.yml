name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov ruff
      - name: Run tests
        run: make test
      - name: Run coverage
        run: make coverage
      - name: Run lint
        run: make lint
