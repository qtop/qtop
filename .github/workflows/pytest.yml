name: pytest-qtop

on:
  push:
  pull_request:
    branches:
      - develop
      - master

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.6', '3.7', '3.8', '3.9', '3.10', '3.11', '3.12']
    container:
      image: python:${{ matrix.python-version }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'pytest<8'
      - run: python -m pytest
