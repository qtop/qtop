name: pytest-qtop

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest ruff
      - name: Fortifications check
        run: bash .github/scripts/fortifications.sh
      - name: Lint
        run: make lint
      - name: Test
        run: make test
