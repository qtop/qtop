name: pytest-qtop

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            python:${{ matrix.python-version }}-slim \
            sh -lc '
              if [ "${{ matrix.python-version }}" = "3.6" ]; then
                pytest_spec="pytest<7"
              elif [ "${{ matrix.python-version }}" = "3.7" ]; then
                pytest_spec="pytest<8"
              else
                pytest_spec="pytest"
              fi
              PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip install -q "$pytest_spec"
              python -m pytest
            '
