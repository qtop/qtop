name: pytest-qtop

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pytest
      - run: make ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qtop-sample-artifacts
          path: sample-artifacts/
          if-no-files-found: ignore
