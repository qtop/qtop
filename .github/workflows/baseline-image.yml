##
## Builds BASELINE (ci/baseline/Dockerfile) and publishes it to GHCR as
## ghcr.io/<owner>/qtop-baseline:almalinux8-py36 (moving) and :YYYYMMDD-HHMM
## (one per build, UTC, kept as a trail), then runs make compat-py36 in it,
## pulling with the job's GITHUB_TOKEN. Proof of concept, run by hand only
## (Actions > baseline-image > Run workflow, once this file is on the default branch).

name: baseline-image

on:
  workflow_dispatch:  # manual only for now; the weekly schedule and develop trigger are parked:
  # schedule:
  #   - cron: '17 4 * * 1'  # weekly, Monday: picks up AlmaLinux 8 security updates
  # push:
  #   branches:
  #     - develop
  #   paths:
  #     - ci/baseline/**
  #     - .github/workflows/baseline-image.yml

permissions:
  contents: read

concurrency:
  group: baseline-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # push BASELINE to this repository owner's GHCR namespace
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/qtop-baseline
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          IMAGE="${IMAGE,,}"  # GHCR names are lowercase
          NOW="$(date -u +%s)"
          STAMP="$(date -u -d "@$NOW" +%Y%m%d-%H%M)"  # trail tag: one per build, sorted by date, never moved
          printf 'IMAGE=%s\nSTAMP=%s\n' "$IMAGE" "$STAMP" >> "$GITHUB_ENV"
          docker build --pull -t "$IMAGE:almalinux8-py36" -t "$IMAGE:$STAMP" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u -d "@$NOW" +%Y-%m-%dT%H:%M:%SZ)" \
            ci/baseline
      - name: Smoke test
        run: docker run --rm "$IMAGE:almalinux8-py36" sh -c 'python3.6 --version && make --version && find --version' | head -3
      - name: Publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$STAMP"
          docker push "$IMAGE:almalinux8-py36"
          echo "$IMAGE:$STAMP = $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$STAMP")" | tee -a "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

  # The almalinux-python36 checks in BASELINE, with no dnf. Pulled by tag while it is a PoC.
  almalinux-python36-baseline:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read  # pull BASELINE while its GHCR package is private
    container:
      image: ghcr.io/${{ github.repository_owner }}/qtop-baseline:almalinux8-py36
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make compat-py36 PYTHON="$(command -v python3.6)"
