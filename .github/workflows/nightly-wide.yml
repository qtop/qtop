# Nightly wide (#488): the 26 lanes beyond nightly-core.yml -- more distro
# releases, EOL-archived images, PyPy and rolling distros. They watch
# interpreter and distro drift and may be flaky: a red wide run is a prompt
# to look, not a release blocker. Same lane runner and steps as the core run.

name: nightly-wide-qtop

on:
  # A challenge branch push can validate its exact head in a contributor fork.
  # workflow_dispatch alone is unavailable there until this workflow exists on
  # the fork's default branch.
  push:
    branches:
      - 'develop-202607-*'
  # Scheduled runs check out develop: GitHub schedules the default branch (main),
  # which only moves at releases, so regressions would surface days late.
  # Manual and challenge-branch runs test the ref they were started on.
  schedule:
    - cron: '50 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    name: ${{ matrix.image }} ${{ matrix.pybin || 'python3' }} ${{ matrix.target || 'ci' }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      # GitHub Actions matrix `include` has no per-key defaults, so the job
      # `name` and the run step fall back with `||`: a lane omits any key equal
      # to its default -- pkgs: '-', pybin: python3, target: ci.
      matrix:
        include:
          # -- CPython on official images (pybin: python) -------------------
          - { image: 'python:3.12-bookworm', family: pythonimg, pybin: python }
          - { image: 'python:3.13-bookworm', family: pythonimg, pybin: python }
          - { image: 'python:3.15.2-bookworm', family: pythonimg, pybin: python }
          - { image: 'python:3.6-buster', family: pythonimg, pybin: python, target: compat-py36 }
          # -- distro system interpreters (defaults: python3, ci) -----------
          - { image: 'ubuntu:22.04', family: debian, pkgs: 'python3,python3-venv,python3-pip' }
          - { image: 'ubuntu:25.10', family: debian, pkgs: 'python3,python3-venv,python3-pip' }
          - { image: 'ubuntu:26.10', family: debian, pkgs: 'python3,python3-venv,python3-pip' }
          - { image: 'debian:trixie', family: debian, pkgs: 'python3,python3-venv,python3-pip' }
          - { image: 'almalinux:8', family: rhel, pkgs: 'python3.12,python3.12-pip', pybin: python3.12 }
          - { image: 'almalinux:9', family: rhel, pkgs: 'python3,python3-pip', target: compat-py36 }  # system Python 3.9
          - { image: 'rockylinux:8', family: rhel, pkgs: 'python36', pybin: python3.6, target: compat-py36 }
          - { image: 'rockylinux:9', family: rhel, pkgs: 'python3.11,python3.11-pip', pybin: python3.11 }
          - { image: 'quay.io/centos/centos:stream9', family: rhel, pkgs: 'python3,python3-pip', target: compat-py36 }  # system Python 3.9
          - { image: 'docker.io/library/oraclelinux:8', family: rhel, pkgs: 'python3,python3-pip', target: compat-py36 }
          - { image: 'docker.io/library/oraclelinux:9', family: rhel, pkgs: 'python3,python3-pip', target: compat-py36 }  # system Python 3.9
          - { image: 'fedora:41', family: fedora, pkgs: 'python3,python3-pip' }
          - { image: 'opensuse/leap:15.6', family: suse, pkgs: 'python3', target: compat-py36 }
          - { image: 'opensuse/leap:15.6', family: suse, pkgs: 'python311,python311-pip', pybin: python3.11 }
          - { image: 'amazonlinux:2023', family: amazon, pkgs: 'python3,python3-pip', target: compat-py36 }  # system Python 3.9
          - { image: 'amazonlinux:2023', family: amazon, pkgs: 'python3.12,python3.12-pip', pybin: python3.12 }
          # -- PyPy, EOL-archived and rolling distros -----------------------
          - { image: 'pypy:3.12', family: pypyimg, pybin: pypy3, target: compat-py36 }
          - { image: 'pypy:3.11', family: pypyimg, pybin: pypy3, target: compat-py36 }
          - { image: 'pypy:3.11-8.0.0', family: pypyimg, pybin: pypy3, target: compat-py36 }
          - { image: 'ubuntu:20.04', family: debian, pkgs: 'python3,python3-venv,python3-pip', target: compat-py36 }
          - { image: 'debian:sid', family: debian, pkgs: 'python3,python3-venv,python3-pip' }
          - { image: 'archlinux:base', family: arch, pkgs: 'python,python-pip', pybin: python }
    steps:
      - name: bootstrap git for checkout (best effort; suse strictly needs it)
        run: |
          case "${{ matrix.family }}" in
            debian)
              apt-get update || true
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates || true
              ;;
            rhel|fedora|amazon) dnf -y install git || true ;;
            suse) zypper --non-interactive refresh || true; zypper --non-interactive install git || true ;;
            arch) pacman -Syu --noconfirm git || true ;;
            *) echo "official image, git preinstalled" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - run: bash ci/scripts/matrix_lane.sh "${{ matrix.family }}" "${{ matrix.pkgs || '-' }}" "${{ matrix.pybin || 'python3' }}" "${{ matrix.target || 'ci' }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-lane-${{ strategy.job-index }}
          path: artifacts/
          if-no-files-found: ignore
