name: qtop-ci

on:
  push:
    branches:
      - main
      - develop
      - "releases/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  python-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest coverage build ruff
      - run: make ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sample-gate-${{ matrix.python-version }}
          path: artifacts/sample-gate

  python36-almalinux8:
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - run: dnf install -y git make python36 python36-pip
      - run: python3.6 -m pip install "pytest<7" "coverage<7"
      - run: make PYTHON=python3.6 test sample-gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sample-gate-python3.6
          path: artifacts/sample-gate

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: make dist
