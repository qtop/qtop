name: qtop-ci
on:
  push:
    branches:
      - main
      - develop
      - 'releases/**'
  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.10'
      - run: pip install ruff
      - run: make lint
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.10'
      - run: pip install pytest
      - run: make test
  python3.6-almalinux8:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: almalinux:8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Python 3.6
        run: |
          dnf install -y python3.6 python3-pip
          python3 -m pip install --upgrade pip
          pip3 install pytest
      - name: Run tests
        run: python3 -m pytest
      - name: Verify Python 3.6 compat
        run: python3 -m py_compile qtop_py/qtop.py qtop_py/yaml_parser.py qtop_py/plugins/pbs.py qtop_py/plugins/sge.py qtop_py/plugins/slurm.py
  fortify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.10'
      - run: pip install ruff
      - run: make fortify
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: fortify-report
          path: fortify-report.txt
  sample-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.10'
      - run: pip install pytest pyyaml
      - name: Slurm sample gate
        run: make test-slurm-samples
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: slurm-sample-rendered
          path: /tmp/qtop-slurm-rendered/
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.10'
      - run: pip install build
      - run: make dist
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: qtop-dist
          path: dist/
