name: build-qtop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'releases/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  modern-python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # pre-pr without its coverage run, which coverage.yml owns so its badge reports only the coverage gate.
          - python-version: '3.12.3'
            checks: 'lint format-check type-check backend-validation deterministic-fuzz coverage-fuzz'
          - python-version: '3.15.2'
            checks: ci
    env:
      MAKE_CHECKS: ${{ matrix.checks }}
      FORTIFY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/develop' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: make ci-deps PYTHON=python
      - run: make $MAKE_CHECKS PYTHON=python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sample-gate-${{ matrix.python-version }}
          path: |
            artifacts/sample-gate/
            artifacts/tests/
            artifacts/coverage/
            artifacts/fuzz/
            artifacts/repo-sanity/

  # No git in the AlmaLinux jobs: it pulled in 55 packages, and checkout falls back to a REST download.
  almalinux-python36:
    runs-on: ubuntu-24.04
    container: almalinux:8
    timeout-minutes: 10  # a slow mirror once took dnf 4 minutes
    steps:
      # Primary repo.almalinux.org instead of the mirror list, no Extras, and dnf drops a source slower than 50 kB/s after 10 s.
      - run: |
          sed -i -e 's|^mirrorlist=|#mirrorlist=|' -e 's|^# *baseurl=|baseurl=|' /etc/yum.repos.d/almalinux*.repo
          dnf -y --disablerepo='extras*' --setopt=minrate=50k --setopt=timeout=10 --setopt=install_weak_deps=False --nodocs install make findutils python36
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          PYTHON_BIN="$(command -v python3.6)"
          "$PYTHON_BIN" --version
          make compat-py36 PYTHON="$PYTHON_BIN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sample-gate-python3.6-almalinux8
          path: artifacts/sample-gate-py36/

  schema-compat:
    runs-on: ubuntu-24.04
    container: golang:1.26-bookworm
    env:
      FORTIFY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/develop' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the mounted checkout for container Git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make schema-ci

  # The nightly-core debian:bookworm lane on every PR: root in a container, the distro's Python and
  # git owned by another user -- conditions behind most nightly failures (root-only permission
  # checks, git rev-parse, distro build tooling) that the jobs above never see.
  nightly-lane:
    name: debian:bookworm python3 ci (nightly-core lane)
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 20
    steps:
      - name: bootstrap git for checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash ci/scripts/matrix_lane.sh debian python3,python3-venv,python3-pip python3 ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-lane-debian-bookworm
          path: artifacts/
          if-no-files-found: ignore

  # Starts at once, beside the test jobs: release.yml builds releases, so waiting here only delayed the install check.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
      - run: make github-build PYTHON=python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qtop-dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: qtop-sbom, path: artifacts/sbom/}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: qtop-release-evidence, path: artifacts/release/evidence.json}

  # Installs the wheel built above on Python 3.6 with its bundled pip: no legacy build tools are pinned or fetched.
  almalinux-python36-install:
    needs: build
    runs-on: ubuntu-24.04
    container: almalinux:8
    timeout-minutes: 10
    steps:
      # Primary repo.almalinux.org instead of the mirror list, no Extras, and dnf drops a source slower than 50 kB/s after 10 s.
      - run: |
          sed -i -e 's|^mirrorlist=|#mirrorlist=|' -e 's|^# *baseurl=|baseurl=|' /etc/yum.repos.d/almalinux*.repo
          dnf -y --disablerepo='extras*' --setopt=minrate=50k --setopt=timeout=10 --setopt=install_weak_deps=False --nodocs install make findutils python36
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qtop-dist
          path: dist/
      - run: make legacy-install-check PYTHON="$(command -v python3.6)" DIST_DIR=dist
