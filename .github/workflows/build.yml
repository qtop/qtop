name: build-qtop

on:
  push:
    branches:
      - master
      - 'releases/**'
  pull_request:
    branches:
      - master

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: pyproject-build
      - uses: actions/upload-artifact@v5
        with:
          name: qtop-dist
          path: dist/
