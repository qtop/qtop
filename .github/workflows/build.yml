name: build-qtop

on:
  push:
    branches:
      - main
      - master
      - 'releases/**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: pyproject-build
      - uses: actions/upload-artifact@v4
        with:
          name: qtop-dist
          path: dist/
