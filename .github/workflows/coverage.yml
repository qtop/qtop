# Coverage concern (#488), GitHub flavour: ``make coverage-xml`` produces the
# same Cobertura report that ci/coverage.gitlab-ci.yml publishes to GitLab.
# GitHub stores it as a workflow artifact, so no external coverage service or
# identity-token permission is required. The shared target enforces the configured total coverage floor.

name: coverage-qtop

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
      - run: make ci-deps PYTHON=python
      - run: make coverage-xml PYTHON=python
        env:
          COVERAGE_CORE: sysmon  # sys.monitoring (3.12+): same report, about 30% faster than the default tracer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-cobertura-xml
          path: |
            artifacts/coverage/
            artifacts/tests/
