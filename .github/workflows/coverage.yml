# Coverage concern (#488), GitHub flavour: the same ``make coverage-xml``
# Cobertura artifact that ci/coverage.gitlab-ci.yml publishes to GitLab is
# uploaded here as a workflow artifact and offered to Codecov. Push and manual
# runs use OIDC and fail if the upload fails. Pull requests use public-repo
# tokenless upload as a non-gating signal. The current baseline is 50%.

name: coverage-qtop

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.3'
      - run: make ci-deps PYTHON=python
      - run: make coverage-xml PYTHON=python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-cobertura-xml
          path: artifacts/coverage/coverage.xml
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          files: artifacts/coverage/coverage.xml
          flags: pytest
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          use_oidc: ${{ github.event_name != 'pull_request' }}
