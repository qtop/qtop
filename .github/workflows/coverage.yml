# Coverage concern (#488), GitHub flavour: ``make coverage-xml`` produces the
# same Cobertura report that ci/coverage.gitlab-ci.yml publishes to GitLab.
# GitHub stores it as a workflow artifact, so no external coverage service or
# identity-token permission is required. The current validated baseline is 57%.

name: coverage-qtop

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.3'
      - run: make ci-deps PYTHON=python
      - run: make coverage-xml PYTHON=python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-cobertura-xml
          path: artifacts/coverage/coverage.xml
