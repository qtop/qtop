# Coverage gate, GitHub flavour: runs the full suite once under coverage and
# enforces COVERAGE_MIN/COVERAGE_BRANCH_MIN, so this workflow's badge means
# exactly "tests pass and coverage meets the floors". build.yml runs the rest of
# pre-pr; GitLab keeps both in one modern-python job. The Cobertura report is a
# workflow artifact, so no external coverage service or token is required.

name: coverage-qtop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'releases/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.14+ measures branches with sys.monitoring, much cheaper than the ctrace tracer.
          python-version: '3.15.2'
      - run: make ci-deps PYTHON=python
      - run: make coverage-xml PYTHON=python
        env:
          COVERAGE_CORE: sysmon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-cobertura-xml
          path: |
            artifacts/coverage/
            artifacts/tests/
