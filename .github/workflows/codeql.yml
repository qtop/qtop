##
## qtop is a tool to monitor queuing systems - https://github.com/qtop/qtop
## SPDX-License-Identifier: MIT
##
# Requires Advanced setup: GitHub rejects these uploads while Default setup
# is enabled. See docs/ci-sample-gates.md#codeql-analysis.
name: codeql-qtop

on:
  push:
    branches:
      - main
      - develop
      - 'releases/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '35 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
          build-mode: none
          # Includes security-extended plus reliability/maintainability queries.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:python
