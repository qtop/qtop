##
## qtop is a tool to monitor queuing systems - https://github.com/qtop/qtop
## SPDX-License-Identifier: MIT
##
# Requires Advanced setup: GitHub rejects these uploads while Default setup
# is enabled. See docs/ci-sample-gates.md#codeql-analysis.
name: codeql-qtop

on:
  push:
    branches:
      - main
      - develop
      - 'releases/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '35 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
          # Includes security-extended plus reliability/maintainability queries.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
