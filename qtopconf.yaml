## Default configuration file for qtop.
## DO NOT OVERWRITE this file with your own settings. Instead, 
## create a new qtopconf.yaml in ~/.local/qtop/ (you can copy this one if you want)
## IMPORTANT: a blank line MUST be left after every line of *python code*.
## Lines beginning with double hash are comments
## Lines beginning with single hash are commands commented out that you could try out.
## Available colors and fg-bg combinations depicted in colormap.py, in color_to_code

## scheduler possible values (currently supported): pbs, oar, sge, slurm, slurm_json, lsf, htcondor
## auto detects available batch commands, preferring legacy Slurm over JSON.
scheduler: auto

## Slurm GPUs, TPUs and NPUs by node, with their jobs, below the matrix; false hides them.
## accelerator_map: true

## Experimental, administrator-verified Slurm GPU pairs; disabled unless configured.
## Node ranges use Slurm hostlist syntax. Indices are Slurm GRES indices, not CUDA IDs.
## experimental_gpu_pairs:
##   gpu[001-009]: [[0, 1], [2, 3]]

## Optional queue eligibility for -e --queue-nodes (needed for PBS/OAR).
## experimental_queue_nodes:
##   old_nodes: node[001-022]
##   new_nodes: node[023-033]

## where to save output from batch commands and their intermediate conversion to json format
## All intermediate files, collection/extraction workspaces, exports and captures.
## Use a private subdirectory, e.g. /dev/shm/qtop_$USER, or $TMPDIR/qtop_$USER.
## CLI: -o savepath=/dev/shm/qtop_$USER. If it is unusable, qtop warns and uses a private
## qtop_fallback_<uid> under /dev/shm, the temp dir or $QTOP_FALLBACK_DIR (--strict-parents stops).
savepath: /tmp/qtop_results_$USER

## Maximum seconds per live scheduler command or optional account lookup.
## Must be positive and finite; CLI override: -o scheduler_command_timeout=240
scheduler_command_timeout: 180

## Experimental web interface (-B -e). IPv4 address or hostname; no authentication/TLS.
## Loopback is the default; exposing it on a network is an explicit operator choice.
experimental_web_host: 127.0.0.1
experimental_web_port: 8080

## Each backend in qtop_py/plugins/ declares its scheduler commands, the signature command that
## -b auto looks for, and its state names. Set any of them here: a layer overrides only the keys
## it names (schedulers.slurm.sinfo_file, signature_commands.lsf, state_abbreviations.pbs.Q...),
## the rest keep their defaults. Each command line is 'output file, command'; with -s, qtop reads
## those files (minus %(pid)s) instead. The default commands, ready to copy into a shell:
# schedulers:
#   demo:
#     demo_file: %(savepath)s/demo%(pid)s.txt, echo 'Demo here'
#   htcondor:
#     status_json: %(savepath)s/condor_status%(pid)s.json, condor_status -json -attributes Name,Machine,SlotType,PartitionableSlot,DynamicSlot,State,Activity,Cpus,TotalSlotCpus
#     q_json: %(savepath)s/condor_q%(pid)s.json, condor_q -allusers -json -attributes ClusterId,ProcId,Owner,JobStatus,RemoteHost,RequestCpus,AcctGroup
#   lsf:
#     bhosts_file: %(savepath)s/bhosts%(pid)s.txt, bhosts -w
#     bqueues_file: %(savepath)s/bqueues%(pid)s.txt, bqueues -w
#     bjobs_file: %(savepath)s/bjobs%(pid)s.txt, bjobs -u all -o "jobid jobindex stat user queue exec_host delimiter='|'"
#   oar:
#     oarnodes_s_file: %(savepath)s/oarnodes_s_Y%(pid)s.txt, oarnodes -s -Y
#     oarnodes_y_file: %(savepath)s/oarnodes_Y%(pid)s.txt, oarnodes -Y
#     oarstat_file: %(savepath)s/oarstat%(pid)s.txt, oarstat
#   pbs:
#     pbsnodes_file: %(savepath)s/pbsnodes_a%(pid)s.txt, pbsnodes -a
#     qstatq_file: %(savepath)s/qstat_q%(pid)s.txt, qstat -Q -f -F json
#     qstat_file: %(savepath)s/qstat%(pid)s.txt, qstat -f -F json
#   sge:
#     sge_file: %(savepath)s/qstat%(pid)s.F.xml.stdout, qstat -F -xml -u '*'
#   slurm:
#     squeue_file: %(savepath)s/squeue%(pid)s.txt, squeue --states=all -r -h -O 'JobID:0|,UserName:0|,StateCompact:0|,Partition:0|,NumCPUs:0|,NodeList:0|,tres-alloc:0|,tres-per-node:0|,tres-per-task:0|,ArrayJobID:0|,ArrayTaskID:0'
#     sinfo_file: %(savepath)s/sinfo%(pid)s.txt, sinfo -N -h -O 'NodeList:0|,Partition:0|,StateCompact:0|,CPUs:0|,Gres:0|,GresUsed:0|,Available:0'
#     scontrol_file: %(savepath)s/scontrol%(pid)s.txt, scontrol --details show jobs
#   slurm_json:
#     partitions_json: %(savepath)s/slurm_partitions%(pid)s.json, scontrol --json show partitions
#     nodes_json: %(savepath)s/slurm_nodes%(pid)s.json, scontrol --json show nodes
#     jobs_json: %(savepath)s/slurm_jobs%(pid)s.json, scontrol --json show jobs

## OAR only: the symbol shown for each OAR node state; set only the states to change, e.g.
# oar_node_state_mappings:
#   Dead: X

percentage: 0.8 # if less than PERCENTAGE x 100% of the matrices have jobs, perform a blind remap
possible_ids: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz # IDs of unix accounts, for the lower part of qtop
non_existent_node_symbol: #
## Option to remove unneeded corelines taking up precious screen space.
## 0 removes nothing, 1 removes corelines consisting entirely of '#'s,
## 2 removes corelines consisting of '#'s and '_'s.
rem_empty_corelines: 0
## If True, ignore the scheduler's job-core mapping and stack each node's jobs from its
## first core, one job's cores together, as SGE always shows them (S toggles it in watch mode).
stack_jobs_per_node: False
## Term size is autodetected. If that fails, a value is read from here.
## If commented out, will get a fallback_terms_size from within constants.py
# term_size: [53, 176]
# term_size: [53, 126]  # for smaller screens, namely 1366 x 768
user_color_mappings:  # order should be from more generic-->more specific
# - \w+: Gray_D  # enabling this cancels all saved accounts in colormap.py
# - [\d]+: Gray_D
# - [A-Za-z]+0\d{2}: Red_L
# - [A-Za-z]+15\d: Gray_D
# - \w*lhc\w*: Cyan_L
# - \w+00\d: Blue
# - \w*cms\w*: Red_L
 - \w*cms048: Blue
 - \w*cms193: Gray_L
 - \w*atl\w+: Red

queue_color_mappings:
  - alice: Red_L
  - dteam\w+: Cyan_L

nodestate_color_mappings:  
 - au: BlackOnRed
 - d: Red_LOnGrayBG

## if cluster numbering should start on a number # above this, do automatic blind remapping
exotic_starting_wn_nr: 9000
remapping:
# - torvalds(\d+): tor\1
# - gridlab(\d+): glab\1
# - gridmon(\d*): mon\1
 # - ^da-(.*?): ca\1
 # - (.*?)cluster(.*?): \1-\2  # remove "cluster" word from all node names
## WARNING: not working properly in native yaml parser
# - -: ""  # removes dashes for shortening (can also replace them with something else, e.g. _

## re-arranging lines will sort nodes with the respective sorting priority (first line has top priority)
sorting:
   user_sort:
     - sort by nodename-notnum
     - sort by all numbers
  #   - sort by core occupancy
  #   - sort by first letter
  #   - sort by node state
  #   - sort by nr of cores
  #   custom Python sort expressions are not supported

   reverse: False

## Custom Python sorting expressions are intentionally unsupported; use the
## named sort options above so configuration does not execute code.

## exclude filters gradually cut off selected nodes from the last set of remaining nodes
## include filters do a consecutive selection, e.g. from 100 nodes 30 are selected, then the next include filter will select 10 out of those and so on.
## or_include filters select the union of the selections.
## Filters can only be combined if they are the same kind, i.e. exclude with exclude, or_include with or_include
## IMPORTANT: single-item lists need to end in a comma! e.g. ['^gaia-',]
## Active filters enable compact node remapping; use -F to display hostnames.
filtering:
 # - exclude_node_states: ['hqw','au']
 # - exclude_numbers: [3,4]
 # - exclude_name_patterns:  ['^da-p6','^da-p7']
 # - include_name_patterns:  ['^da-p6',]
 # - include_node_states: ['hqw','au']
 # - include_numbers: [3,4]
 # - or_include_numbers: [3,4]
 # - or_include_node_states: ['hqw','au']
 # - or_include_name_patterns: ['^da-p6','^da-p7','^da-p8']
 # - or_include_name_patterns: 
   # - ^da-p[67]
   # - ^da-p8

## Highlight selected usernames (regex expression), userIDs and/or Queues

highlight:
  #- or_include_user_pat: ['biomed017']
  #- or_include_queue: ['whole', 'grid500M']
  #- or_include_user_id: ['0', '1']
  #- include_queue: ['whole']
  #- include_user_pat: ['biomed\d+']

## what parts of qtop to display
user_display_parts:
 - job_accounting_summary
 - workernodes_matrix
 - user_accounts_pool_mappings


#wn_occupancy:
# - wn id lines
# - node state
# - temperature  # not working. For illustrative purposes
# - core_user_map

## character used for vertical separator in WN occupancy matrix
vertical_separator: '|'
## Put vertical_separator every X columns.
vertical_separator_every_X_columns: 0
## Put vertical_separator in case of overspill (SGE systems only).
separator_after_overspill: True

workernodes_matrix:
 - wn id lines:
     max_len: 22
     ## Masking/clipping functionality. How high should the # earliest node number be (e.g. 50), to make the previous WNs vanish
     min_masking_threshold: 9
     ## Change this to an int if you want a custom cut matrix length
     user_cut_matrix_width: 0
     ## customised end labels
     end_labels:
       1: ['={__WNID__}',]
       2: ['={_Worker_}', '={__Node__}']
       3: ['={_Worker_}', '={__Node__}', '={___ID___}']
       4: ['={________}', '={_Worker_}', '={__Node__}', '={___ID___}']
       5: ['={________}', '={________}', '={_Worker_}', '={__Node__}', '={___ID___}']
       6: ['={________}', '={________}', '={________}', '={_Worker_}', '={__Node__}', '={___ID___}']
       7: ['={________}', '={________}', '={________}', '={________}', '={_Worker_}', '={__Node__}', '={___ID___}']
     ## Colors that named worker-node labels (-F) alternate through: they change per name group
     ## (names differing only in digits) and at least every 5 nodes within a group.
     alt_label_colors: [White, Blue_L]
# - temperature:  # not working, for illustrative purposes
#     yaml key: temperature  # how it's found in the yaml file
#     label: Temperature (C)  # how to label it on the qtop matrix
#     option: {}
#     max_len: 1
 ## Rows without a systems list apply to every scheduler, so a new backend gets them too.
 ## Add e.g. "systems: [pbs, slurm]" to a row to show it only for those schedulers.
 - node state:
     yaml_key: state
     label: Node state
     max_len: 5
 - queue name:
     yaml_key: qname
     label: queue name
     max_len: 13
 - core_user_map:
     options1: {}
     options2: {}

extract_info:
  user_details_cache: cat -E $HOME/.local/qtop/getent_passwd.txt # this gets cached GECOS field info
  user_details_realtime: getent passwd %s # alternative method to get details in realtime
  field_to_use: 5
  regex: |
    re.search('(?<=<)[^<>]+(?=>)', field).group(0)

## If set to true, wn_occupancy matrices contain the first letter of the user
## owning the job. If false, it will show a mapped single-letter id instead.
## The latter is useful when there are a lot of users starting with the same letter.
fill_with_user_firstletter: False
## Order in which users receive IDs (possible_ids: 0-9 go to the top 10, the long tail gets '*').
## Job-count keys rank higher counts first: all (every job, any state), R+Q, R, Q.
## The list must end with name_desc or name_asc, so ties always resolve the same way.
## name_desc matches the original 2012 shell qtop. Examples: [all, R, name_asc], [R+Q, R, name_desc], [all, name_desc]
user_id_ranking:
  - all
  - R               ## R is not part of ranking in 2012 qtop.sh; drop it to get its exact order, [all, name_desc]
  - name_desc
## Note printed after the "User accounts and pool mappings" title. {ranking} expands to user_id_ranking above.
## Use single quotes; '' prints no note. --classic shows the scheduler's own note instead.
## Anonymized samples (-L -A) reset it to this default, since free text may identify the site.
user_accounts_header: '(ranked by {ranking})'
## If set to true, lines represent worker nodes, wherease if set to false, columns do.
## Default is True
transpose_wn_matrices: True
occupancy_column_order:
  - wnid_lines
  - core_map
  - Node state
  - queue name
horizontal_separator: '|'

auto_delete_old_output_files_after: 24h  # (m)inutes, (s)econds also supported
replay_last: 2m   # when --replay is invoked, this is the time qtop will automatically replay from if no datetime/duration is given
overwrite_sample_file: True  # True (default) writes to tar using the same constant filename, False appends a timestamp
## core_coloring can be either:
##  - user_to_color, which paints core jobs according to the userid color, or
##  - queue_to_color, which paints core jobs according to queue color
core_coloring: user_to_color
## Accounts-table state columns (default: running_of_user, queued_of_user, other_of_user, i.e. "jobs >= R + Q + O").
## Use values from state_abbreviations above; other_of_user counts jobs in none of the listed states.
## An entry may be a {state key: label} mapping; the default label is the key's first letter, uppercased.
# accounts_states:
#   - running_of_user
#   - cancelled_of_user
#   - queued_of_user
#   - other_of_user
## Summary-line job breakdown (Total=R+Q+Other), same entries as accounts_states. Unset (default): scheduler-reported
## R and Q, plus the listed jobs in neither state; when set, counts are taken from the job list, as in the accounts table.
# summary_states:
#   - running_of_user
#   - queued_of_user
#   - other_of_user
## Summary-line count colours, in order Total, R, Q, Other (more states reuse them), from the colormap names, e.g.
## BlackOnBlue, WhiteOnBlue, BlackOnGreen, BlackOnGold, WhiteOnRed, BlackOnOrange256 (needs a 256-colour terminal).
## Unset (default): blue, green, orange (red without 256 colours) and yellow backgrounds.
## Compact queue R/Q and per-user Total/R/Q counts use these colours too.
# summary_colours:
#   - WhiteOnBlue
#   - BlackOnGreen
#   - BlackOnOrange256
#   - BlackOnGold
## SGE only, opt-in: a running job in a queue matching these names or globs (fnmatch) occupies its whole node,
## i.e. it is drawn on every free core up to the node's num_proc. Cores held by other jobs are kept.
# sge_whole_queues:
#   - world
#   - whole*
