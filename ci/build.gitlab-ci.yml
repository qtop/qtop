# Build concern: package the sdist/wheel once the test concern is green.
#
# ``make gitlab-build`` builds and validates the exact sdist/wheel pair with the
# pinned CI dependencies from requirements-ci.txt, so the artefacts produced
# here match what a contributor builds locally with the same Makefile target.

build:
  image: python:3.12.3-bookworm
  stage: build
  needs:
    - modern-python
    - almalinux-python36
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make
  script:
    - make gitlab-build PYTHON=python
  artifacts:
    paths:
      - dist/

# Installs the wheel built above on Python 3.6 with its bundled pip: no legacy build tools are pinned or fetched.
almalinux-python36-install:
  image: almalinux:8
  stage: build
  needs:
    - build
  before_script:
    - dnf -y install make findutils
    - dnf -y install python36
  script:
    - make legacy-install-check PYTHON="$(command -v python3.6)" DIST_DIR=dist
