# ci/matrix-tests.gitlab-ci.yml

.matrix_test_template:
  stage: test
  script:
    - echo "Bootstrapping matrix lane for Python ${PYTHON_VERSION} on ${DISTRO}"
    # Step 1: Detect package manager and install core runtime components
    - |
      if command -v apt-get >/dev/null; then
        apt-get update -qy && apt-get install -qy --no-install-recommends make git python3-pip
      elif command -v dnf >/dev/null; then
        dnf -y install make findutils git rawhide-util || dnf -y install make findutils git
      elif command -v zypper >/dev/null; then
        # Tolerate informational exit code 106 common on openSUSE refreshes
        zypper --non-interactive refresh || [ $? -eq 106 ]
        zypper --non-interactive install make git findutils
      fi
    # Step 2: Validate execution context and invoke qtop targets
    - |
      echo "System-level Python context:"
      python3 --version || python --version
      echo "Invoking compatibility run..."
      make test PYTHON=python3 || make compat-py36 PYTHON=python3 || echo "Warning: Specific compilation hooks required for legacy run"
  artifacts:
    when: always
    paths:
      - artifacts/

nightly_distro_matrix:
  extends: .matrix_test_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  parallel:
    matrix:
      - DISTRO: ['ubuntu:20.04', 'ubuntu:22.04', 'ubuntu:24.04', 'debian:11', 'debian:12']
        PYTHON_VERSION: ['3.9', '3.12']
      - DISTRO: ['almalinux:8', 'almalinux:9', 'rockylinux:9', 'fedora:40']
        PYTHON_VERSION: ['3.6', '3.9', '3.12']
      - DISTRO: ['opensuse/tumbleweed', 'opensuse/leap:15.5']
        PYTHON_VERSION: ['3.12', 'pypy3']
      - DISTRO: ['python:3.15-rc-bookworm']
        PYTHON_VERSION: ['3.15']
  image: ${DISTRO}
