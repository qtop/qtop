# Nightly concern: interpreter/distro compatibility matrix (#488), in two tiers
# that mirror .github/workflows/nightly-core.yml and nightly-wide.yml lane for
# lane, all routed through ci/scripts/matrix_lane.sh and the Makefile contract:
# - nightly-core: 8 lanes, one per dimension that has caught regressions; a
#   failure fails the pipeline and is a qtop regression to fix.
# - nightly-wide: the other 26 lanes (more releases, EOL-archived images, PyPy,
#   rolling distros) watch drift and may be flaky, so they are allow_failure:
#   a warning to look at, not a red pipeline.
#
# Activation (one-time, GitLab UI): Build > Pipeline schedules > New schedule
#   - interval pattern: 20 4 * * *
#   - target branch: develop (main only moves at releases, so regressions
#     would surface days late)
#   - add variable NIGHTLY_MATRIX=1
# A manual web-triggered pipeline with NIGHTLY_MATRIX=1 runs the same lanes
# on demand. Regular branch/MR pipelines never run these jobs.

.nightly-lane-base:
  stage: nightly
  image: $IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_MATRIX == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $NIGHTLY_MATRIX == "1"'
  script:
    - bash ci/scripts/matrix_lane.sh "$FAMILY" "$PKGS" "$PYBIN" "$TARGET"
  artifacts:
    when: always
    paths:
      - artifacts/
    expire_in: 1 week

nightly-core:
  extends: .nightly-lane-base
  parallel:
    matrix:
      - IMAGE: ['python:3.12-bookworm', 'python:3.15-bookworm']
        FAMILY: pythonimg
        PKGS: '-'
        PYBIN: python
        TARGET: ci
      - IMAGE: ['debian:bookworm', 'ubuntu:24.04']
        FAMILY: debian
        PKGS: 'python3,python3-venv,python3-pip'
        PYBIN: python3
        TARGET: ci
      - IMAGE: 'fedora:42'
        FAMILY: fedora
        PKGS: 'python3,python3-pip'
        PYBIN: python3
        TARGET: ci
      - IMAGE: 'almalinux:9'
        FAMILY: rhel
        PKGS: 'python3.12,python3.12-pip'
        PYBIN: python3.12
        TARGET: ci
      - IMAGE: 'almalinux:8'
        FAMILY: rhel
        PKGS: 'python36'
        PYBIN: python3.6
        TARGET: compat-py36
      - IMAGE: 'rockylinux:9'  # system Python 3.9: dependency-light gate
        FAMILY: rhel
        PKGS: 'python3,python3-pip'
        PYBIN: python3
        TARGET: compat-py36

nightly-wide:
  extends: .nightly-lane-base
  allow_failure: true
  parallel:
    matrix:
      - IMAGE: ['python:3.11-bookworm', 'python:3.13-bookworm', 'python:3.14-bookworm']
        FAMILY: pythonimg
        PKGS: '-'
        PYBIN: python
        TARGET: ci
      - IMAGE: 'python:3.6-buster'
        FAMILY: pythonimg
        PKGS: '-'
        PYBIN: python
        TARGET: compat-py36
      - IMAGE: ['ubuntu:22.04', 'ubuntu:25.10', 'ubuntu:26.10', 'debian:trixie', 'debian:sid']
        FAMILY: debian
        PKGS: 'python3,python3-venv,python3-pip'
        PYBIN: python3
        TARGET: ci
      - IMAGE: 'ubuntu:20.04'
        FAMILY: debian
        PKGS: 'python3,python3-venv,python3-pip'
        PYBIN: python3
        TARGET: compat-py36
      - IMAGE: 'almalinux:8'
        FAMILY: rhel
        PKGS: 'python3.12,python3.12-pip'
        PYBIN: python3.12
        TARGET: ci
      - IMAGE: 'amazonlinux:2023'
        FAMILY: amazon
        PKGS: 'python3.12,python3.12-pip'
        PYBIN: python3.12
        TARGET: ci
      - IMAGE: 'rockylinux:8'
        FAMILY: rhel
        PKGS: 'python36'
        PYBIN: python3.6
        TARGET: compat-py36
      - IMAGE: 'rockylinux:9'
        FAMILY: rhel
        PKGS: 'python3.11,python3.11-pip'
        PYBIN: python3.11
        TARGET: ci
      - IMAGE: ['almalinux:9', 'quay.io/centos/centos:stream9', 'docker.io/library/oraclelinux:8', 'docker.io/library/oraclelinux:9']  # system Python 3.9 (Oracle 8: 3.6)
        FAMILY: rhel
        PKGS: 'python3,python3-pip'
        PYBIN: python3
        TARGET: compat-py36
      - IMAGE: 'fedora:41'
        FAMILY: fedora
        PKGS: 'python3,python3-pip'
        PYBIN: python3
        TARGET: ci
      - IMAGE: 'opensuse/leap:15.6'
        FAMILY: suse
        PKGS: 'python3'
        PYBIN: python3
        TARGET: compat-py36
      - IMAGE: 'opensuse/leap:15.6'
        FAMILY: suse
        PKGS: 'python311,python311-pip'
        PYBIN: python3.11
        TARGET: ci
      - IMAGE: 'amazonlinux:2023'  # system Python 3.9: dependency-light gate
        FAMILY: amazon
        PKGS: 'python3,python3-pip'
        PYBIN: python3
        TARGET: compat-py36
      - IMAGE: ['pypy:3.11', 'pypy:3.12', 'pypy:3.11-8.0.0']
        FAMILY: pypyimg
        PKGS: '-'
        PYBIN: pypy3
        TARGET: compat-py36
      - IMAGE: 'archlinux:base'
        FAMILY: arch
        PKGS: 'python,python-pip'
        PYBIN: python
        TARGET: ci


extended-properties:
  image: python:3.12.3-bookworm
  stage: nightly
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_MATRIX == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $NIGHTLY_MATRIX == "1"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make
    - make ci-deps PYTHON=python
  script:
    - make nightly-properties PYTHON=python
  artifacts:
    when: always
    paths:
      - .hypothesis/
      - artifacts/tests/
    reports:
      junit: artifacts/tests/*.xml
