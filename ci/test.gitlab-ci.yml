# Primary PR gate runs the suite once under coverage, matching GitHub.

modern-python:
  image: python:3.12.3-bookworm
  stage: test
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make git
    - make ci-deps PYTHON=python
    - export TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_NAME:-develop}}"
    - git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
    - export FORTIFY_BASE_REF="origin/${TARGET_BRANCH}"
  script:
    - make pre-pr coverage-xml PYTHON=python
  after_script:
    - make code-quality PYTHON=python
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    when: always
    paths:
      - artifacts/sample-gate/
      - artifacts/fuzz/
      - artifacts/tests/
      - artifacts/coverage/
      - artifacts/code-quality/
      - artifacts/repo-sanity/
    reports:
      junit: artifacts/tests/*.xml
      codequality: artifacts/code-quality/gl-code-quality-report.json
      coverage_report:
        coverage_format: cobertura
        path: artifacts/coverage/coverage.xml

almalinux-python36:
  image: almalinux:8
  stage: test
  # Primary repo.almalinux.org instead of the mirror list, no Extras, and dnf drops a source slower than 50 kB/s after 10 s.
  before_script:
    - sed -i -e 's|^mirrorlist=|#mirrorlist=|' -e 's|^# *baseurl=|baseurl=|' /etc/yum.repos.d/almalinux*.repo
    - dnf -y --disablerepo='extras*' --setopt=minrate=50k --setopt=timeout=10 --setopt=install_weak_deps=False --nodocs install make findutils python36
  script:
    - |
      PYTHON_BIN="$(command -v python3.6)"
      "$PYTHON_BIN" --version
      make compat-py36 PYTHON="$PYTHON_BIN"
  artifacts:
    when: always
    paths:
      - artifacts/sample-gate-py36/


schema-compat:
  image: golang:1.25-bookworm
  stage: test
  variables:
    GIT_DEPTH: "0"
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - export TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_NAME:-develop}}"
    - git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
    - export FORTIFY_BASE_REF="origin/${TARGET_BRANCH}"
  script:
    - make schema-ci
