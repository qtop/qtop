# qtop GitLab CI — Challenge #9
# Mirrors GitHub Actions validation; adds security scanners and nightly matrix.
# AI assistance: Claude Sonnet 4.6 (Anthropic)

stages:
  - test
  - security
  - nightly

# ── Security templates ────────────────────────────────────────────────────
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml

# ── Default settings ──────────────────────────────────────────────────────
default:
  image: python:3.12
  before_script:
    - pip install -r requirements-ci.txt --quiet

# ── Fast test gate (mirrors GitHub CI) ───────────────────────────────────
test:
  stage: test
  script:
    - make ci PYTHON=python
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - artifacts/
    expire_in: 7 days

coverage:
  stage: test
  script:
    - pip install pytest-cov --quiet
    - python -m pytest --cov=qtop_py --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ── Python 3.6 / AlmaLinux compat ────────────────────────────────────────
compat-py36:
  stage: test
  image: almalinux:8
  before_script:
    - dnf install -y python3 python3-pip --quiet
    - python3 --version
  script:
    - pip3 install pytest --quiet
    - python3 -m pytest tests/ -q

# ── Trust audit: bidi/unicode/strange characters ─────────────────────────
trust-audit:
  stage: security
  image: python:3.12
  before_script: []
  script:
    - |
      echo "=== Bidi/Unicode trust audit ==="
      python3 -c "
      import os, re, sys
      suspicious = []
      bidi_chars = ['\u202a','\u202b','\u202c','\u202d','\u202e','\u2066','\u2067','\u2068','\u2069','\u200f']
      for root, dirs, files in os.walk('qtop_py'):
          dirs[:] = [d for d in dirs if d != '__pycache__']
          for f in files:
              if not f.endswith('.py'): continue
              path = os.path.join(root, f)
              content = open(path, encoding='utf-8', errors='replace').read()
              for ch in bidi_chars:
                  if ch in content:
                      suspicious.append((path, repr(ch)))
      if suspicious:
          print('SUSPICIOUS:', suspicious)
          sys.exit(1)
      else:
          print('Clean: no bidi/suspicious characters found')
      "

# ── Nightly matrix: >30 distro×python combinations ───────────────────────
.nightly-base:
  stage: nightly
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - pip install pytest --quiet
    - python -m pytest tests/ -q

