stages:
  - security
  - test
  - coverage
  - build
  - publish

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Code-Quality.gitlab-ci.yml

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SECURE_LOG_LEVEL: info
  SAST_EXCLUDED_PATHS: "artifacts,build,dist,.venv,docs/images"
  SECRET_DETECTION_EXCLUDED_PATHS: "artifacts,build,dist,.venv,docs/images"
  DS_EXCLUDED_PATHS: "artifacts,build,dist,.venv,docs/images"

.python-job:
  image: python:3.12.3-bookworm
  cache:
    key: "pip-${CI_JOB_NAME_SLUG}"
    paths:
      - .cache/pip/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make git
    - make ci-deps PYTHON=python
    - export TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}"
    - git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
    - export FORTIFY_BASE_REF="origin/${TARGET_BRANCH}"

modern-python:
  extends: .python-job
  stage: test
  script:
    - make gitlab-ci PYTHON=python
  artifacts:
    when: always
    paths:
      - artifacts/sample-gate/
      - artifacts/trust-audit/

almalinux-python36:
  image: almalinux:8
  stage: test
  before_script:
    - dnf -y install make findutils
    - dnf -y install python36
  script:
    - |
      PYTHON_BIN="$(command -v python3.6)"
      "$PYTHON_BIN" --version
      make compat-py36 PYTHON="$PYTHON_BIN"
  artifacts:
    when: always
    paths:
      - artifacts/sample-gate-py36/

coverage-cobertura:
  extends: .python-job
  stage: coverage
  script:
    - make coverage-xml PYTHON=python
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: artifacts/coverage/coverage.xml
    paths:
      - artifacts/coverage/

nightly-python-matrix:
  stage: test
  image: "$PYTHON_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  parallel:
    matrix:
      - PYTHON_IMAGE:
          - python:3.9-bookworm
          - python:3.9-slim-bookworm
          - python:3.9-bullseye
          - python:3.9-slim-bullseye
          - python:3.10-bookworm
          - python:3.10-slim-bookworm
          - python:3.10-bullseye
          - python:3.10-slim-bullseye
          - python:3.11-bookworm
          - python:3.11-slim-bookworm
          - python:3.11-bullseye
          - python:3.11-slim-bullseye
          - python:3.12-bookworm
          - python:3.12-slim-bookworm
          - python:3.12-bullseye
          - python:3.12-slim-bullseye
          - python:3.13-bookworm
          - python:3.13-slim-bookworm
          - python:3.13-bullseye
          - python:3.13-slim-bullseye
          - python:3.14-rc-bookworm
          - python:3.14-rc-slim-bookworm
          - python:3.14-rc-bullseye
          - python:3.14-rc-slim-bullseye
          - pypy:3.10-slim-bookworm
          - pypy:3.10-slim-bullseye
          - pypy:3.11-slim-bookworm
          - pypy:3.11-slim-bullseye
          - quay.io/pypa/manylinux2014_x86_64
          - quay.io/pypa/manylinux_2_28_x86_64
          - quay.io/pypa/musllinux_1_2_x86_64
  before_script:
    - |
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update
        apt-get install -y --no-install-recommends make git
      elif command -v yum >/dev/null 2>&1; then
        yum -y install make git
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache make git
      fi
    - |
      if ! command -v python >/dev/null 2>&1; then
        export PATH="/opt/python/cp312-cp312/bin:$PATH"
      fi
    - python --version
    - make ci-deps PYTHON=python
    - export TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}"
    - git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" || true
    - export FORTIFY_BASE_REF="origin/${TARGET_BRANCH}"
  script:
    - make gitlab-ci PYTHON=python
  allow_failure: true
  artifacts:
    when: always
    paths:
      - artifacts/sample-gate/
      - artifacts/trust-audit/

openssf-scorecard:
  image: golang:1.23-bookworm
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git
    - go install github.com/ossf/scorecard/v5@latest
  script:
    - mkdir -p artifacts/scorecard
    - scorecard --repo=https://github.com/qtop/qtop --format=json --show-details > artifacts/scorecard/scorecard.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - artifacts/scorecard/

build:
  image: python:3.12.3-bookworm
  stage: build
  needs:
    - modern-python
    - almalinux-python36
    - coverage-cobertura
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make
  script:
    - make gitlab-build PYTHON=python
  artifacts:
    paths:
      - dist/
