stages:
  - test

ci:
  stage: test
  image: python:3.10-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install pytest
  script:
    - make ci SLURM_OUTPUT_DIR=artifacts/qtop-slurm-rendered
  artifacts:
    when: always
    paths:
      - artifacts/qtop-slurm-rendered
    expire_in: 1 week
