# In watch mode, p/P cycle PALETTES forwards/backwards from the first.
# A palette maps colormap colour names to ANSI SGR codes (digits and ";" only) and
# falls back to the default colours for any name it leaves out; "default" needs no entry.
# Copy this file to ~/.local/qtop/ (or the system directory) to reorder PALETTES,
# change a palette or add your own; entries there replace these name by name.
# The palettes use 256-colour codes and set no terminal background.

PALETTES:
  - default
  - green-monitor
  - solarized-dark
  - gruvbox
  - okabe-ito
  - monochrome
  # Uncomment extras to include them in p/P rotation (20 palettes total).
  # - apprentice
  # - base16-dark
  # - base16-light
  # - catppuccin-frappe
  # - catppuccin-latte
  # - catppuccin-macchiato
  # - catppuccin-mocha
  # - dracula
  # - material
  # - papercolor-dark
  # - papercolor-light
  # - tender
  # - tokyo-night-dark
  # - tokyo-night-light

