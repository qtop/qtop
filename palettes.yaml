# qtop palettes: in watch mode, key p cycles through PALETTES in order, starting with the first.
# A palette maps colormap colour names to ANSI SGR codes (digits and ";" only) and
# falls back to the default colours for any name it leaves out; "default" needs no entry.
# Copy this file to ~/.local/qtop/ (or the system directory) to reorder PALETTES,
# change a palette or add your own; entries there replace these name by name.
# The palettes use 256-colour codes and set no terminal background.

PALETTES:
  - default
  - solarized-dark
  - gruvbox
  - okabe-ito
  - monochrome
  - green-monitor

solarized-dark:
  Gray_D: '1;38;5;240'
  Gray_L: '0;38;5;245'
  White: '1;38;5;254'
  Red: '0;38;5;160'
  Red_L: '1;38;5;160'
