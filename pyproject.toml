[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qtop"
dynamic = ["version"]
description = "qtop: the fast text mode way to monitor your cluster's utilization and status; the time has come to take back control of your cluster's scheduling business"
readme = "README.md"
authors = [
    { name="Sotiris Fragkiskos", email="sfranky@gmail.com"},
    { name="Fotis Georgatos", email="kefalonia@gmail.com"},
]
requires-python = ">=3.6"

[project.urls]
"Homepage" = "https://github.com/qtop/qtop"

[project.scripts]
qtop = "qtop_py.qtop:main"

[tool.setuptools.dynamic]
version = {attr = "qtop_py.__version__"}

[tool.setuptools]
packages = ["qtop_py", "qtop_py.contrib", "qtop_py.inputs", "qtop_py.plugins", "qtop_py.ui", "qtop_py.web"]

[tool.setuptools.package-data]
qtop_py = ["contrib/*", "inputs/*", "web/*"]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
lint.select = ["E", "F", "I"] ##
lint.ignore = ["E722"]

# Ruff no longer accepts py36; py37 is the closest supported parser floor.
target-version = "py37"

## FG customisations
line-length = 188 # this is temporary to reduce noise over line lengths
