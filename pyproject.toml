[build-system]
# Deliberate, not an omission: Python < 3.9 keeps setuptools 59.6, the last release
# supporting Python 3.6 (60.0 requires 3.7). See docs/secure-coding-pyscg.md (PySCG-0053).
requires = [
    "setuptools>=59.6,<60; python_version < '3.9'",
    "setuptools>=78.1.1,<83; python_version == '3.9'",
    "setuptools>=84.1.0; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "qtop"
dynamic = ["version"]
description = "qtop: the fast text mode way to monitor your cluster's utilization and status; the time has come to take back control of your cluster's scheduling business"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
keywords = ["HPC", "monitoring", "PBS", "scheduler", "SGE", "Slurm"]
authors = [
    { name="Sotiris Fragkiskos", email="sfranky@gmail.com"},
    { name="Fotis Georgatos", email="kefalonia@gmail.com"},
    { name="Evangelos Papadopoulos", email="evangelos.papadopoulos@gmail.com"},
    { name="Nicola Trozzi", email="nicola.trozzi@outlook.com"},
]
requires-python = ">=3.6"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Clustering",
    "Topic :: System :: Monitoring",
]

[project.urls]
"Homepage" = "https://github.com/qtop/qtop"
"Changelog" = "https://github.com/qtop/qtop/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/qtop/qtop/blob/main/docs/documentation.md"
"Issues" = "https://github.com/qtop/qtop/issues"
"Security" = "https://github.com/qtop/qtop/security/policy"

[project.scripts]
qtop = "qtop_py.qtop:cli_main"

[tool.setuptools.cmdclass]
build_py = "tools.build_py.BuildPy"

[tool.setuptools.dynamic]
version = {attr = "qtop_py.__version__"}

[tool.setuptools.packages.find]
include = ["qtop_py*"]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
lint.select = ["E", "F", "I"] ##

# Ruff still exposes py37 as its lowest target; Python 3.6 runtime
# compatibility stays covered by the separate compat-py36 gate.
target-version = "py37"

## FG customisations
line-length = 180 # keep legacy output fixtures readable while reducing the previous 188-char ceiling

[tool.ty.environment]
# qtop runs on older Pythons and ty itself supports 3.10 and newer.
# Keep syntax compatibility covered by compat-py36 while using Python 3.12 as the modern analysis and CI baseline.
python-version = "3.12"
python-platform = "linux"

[tool.ty.src]
# Type-check production and developer tooling. Test doubles deliberately use
# duck typing and are validated by pytest instead.
include = ["qtop_py", "tools"]

[tool.ty.analysis]
# Both imports are optional accelerators; qtop has stdlib fallbacks.
allowed-unresolved-imports = ["lxml", "ujson"]

[tool.ty.terminal]
# One diagnostic per line keeps local and CI logs useful (including `ty check
# | wc -l`) while retaining rule names and source locations.
output-format = "concise"

[[tool.ty.overrides]]
include = ["qtop_py/qtop.py"]

[tool.ty.overrides.rules]
# cli_main intentionally binds the legacy module-level runtime context.
unresolved-global = "ignore"

# Whole package: checked bodies (also unannotated ones) and near-free strictness;
# the five contract modules below stay under the full `strict` set.
[tool.mypy]
python_version = "3.12"
files = ["qtop_py"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
# Not yet applicable package-wide (error counts as of 0.9.20261109); the contract modules below already have them.
# FIXME: disallow_untyped_defs = true  # 342 unannotated functions; annotate module by module, then enable
# FIXME: disallow_untyped_calls = true  # 418 calls into unannotated code; follows disallow_untyped_defs
# Deliberately off, though it would pass: a variable keeps one type, its name says what it holds.
# allow_redefinition = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

# Optional accelerators with stdlib fallbacks (cf. tool.ty.analysis).
[[tool.mypy.overrides]]
module = ["lxml", "ujson"]
ignore_missing_imports = true

# Per-module equivalent of `strict = true` (a global-only option) for the contracts;
# serialiser still allows unannotated defs.
[[tool.mypy.overrides]]
module = ["qtop_py.state_types", "qtop_py.cluster_state", "qtop_py.sample", "qtop_py.serialiser", "qtop_py.ui.viewport"]
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = ["qtop_py.state_types", "qtop_py.cluster_state", "qtop_py.sample", "qtop_py.ui.viewport"]
disallow_untyped_defs = true

[tool.coverage.run]
source = ["qtop_py"]
parallel = true
patch = ["subprocess"]

[tool.coverage.paths]
source = ["qtop_py", "*/qtop_py"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
include = ["qtop_py/state_types.py", "qtop_py/cluster_state.py", "qtop_py/sample.py", "qtop_py/serialiser.py", "qtop_py/ui/viewport.py"]
typeCheckingMode = "standard"
strict = ["qtop_py/state_types.py", "qtop_py/cluster_state.py", "qtop_py/sample.py", "qtop_py/ui/viewport.py"]
