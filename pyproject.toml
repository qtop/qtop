[build-system]
requires = [
    "setuptools>=44,<60; python_version < '3.7'",
    "setuptools>=78.1.1,<83; python_version >= '3.7' and python_version < '3.12'",
    "setuptools>=83.0.0; python_version >= '3.12'",
]
build-backend = "setuptools.build_meta"

[project]
name = "qtop"
dynamic = ["version"]
description = "qtop: the fast text mode way to monitor your cluster's utilization and status; the time has come to take back control of your cluster's scheduling business"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
keywords = ["HPC", "monitoring", "PBS", "scheduler", "SGE", "Slurm"]
authors = [
    { name="Sotiris Fragkiskos", email="sfranky@gmail.com"},
    { name="Fotis Georgatos", email="kefalonia@gmail.com"},
    { name="Evangelos Papadopoulos", email="evangelos.papadopoulos@gmail.com"},
    { name="Nicola Trozzi", email="nicola.trozzi@outlook.com"},
]
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Clustering",
    "Topic :: System :: Monitoring",
]

[project.urls]
"Homepage" = "https://github.com/qtop/qtop"
"Changelog" = "https://github.com/qtop/qtop/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/qtop/qtop/blob/main/docs/documentation.md"
"Issues" = "https://github.com/qtop/qtop/issues"
"Security" = "https://github.com/qtop/qtop/security/policy"

[project.scripts]
qtop = "qtop_py.qtop:cli_main"

[tool.setuptools.cmdclass]
build_py = "tools.build_py.BuildPy"

[tool.setuptools.dynamic]
version = {attr = "qtop_py.__version__"}

[tool.setuptools.packages.find]
include = ["qtop_py*"]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
lint.select = ["E", "F", "I"] ##

# Ruff still exposes py37 as its lowest target; Python 3.6 runtime
# compatibility stays covered by the separate compat-py36 gate.
target-version = "py37"

## FG customisations
line-length = 180 # keep legacy output fixtures readable while reducing the previous 188-char ceiling

[tool.ty.environment]
# qtop runs on older Pythons, and ty itself supports 3.10 and newer. Keep
# syntax compatibility covered by compat-py36 while using Python 3.12 as the
# modern analysis and CI baseline.
python-version = "3.12"
python-platform = "linux"

[tool.ty.src]
# Type-check production and developer tooling. Test doubles deliberately use
# duck typing and are validated by pytest instead.
include = ["qtop_py", "tools"]

[tool.ty.analysis]
# Both imports are optional accelerators; qtop has stdlib fallbacks.
allowed-unresolved-imports = ["lxml", "ujson"]

[tool.ty.terminal]
# One diagnostic per line keeps local and CI logs useful (including `ty check
# | wc -l`) while retaining rule names and source locations.
output-format = "concise"

[[tool.ty.overrides]]
include = ["qtop_py/qtop.py"]

[tool.ty.overrides.rules]
# cli_main intentionally binds the legacy module-level runtime context.
unresolved-global = "ignore"

# First-pass contracts; legacy callers are analyzed as imported dependencies.
[tool.mypy]
python_version = "3.12"
files = ["qtop_py/contracts.py", "qtop_py/cluster_state.py", "qtop_py/sample.py", "qtop_py/serialiser.py", "qtop_py/ui/viewport.py"]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "qtop_py.serialiser"
disallow_untyped_defs = false

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
include = ["qtop_py/contracts.py", "qtop_py/cluster_state.py", "qtop_py/sample.py", "qtop_py/serialiser.py", "qtop_py/ui/viewport.py"]
typeCheckingMode = "standard"
strict = ["qtop_py/contracts.py", "qtop_py/cluster_state.py", "qtop_py/sample.py", "qtop_py/ui/viewport.py"]
