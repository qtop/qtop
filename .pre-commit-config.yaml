## Hook versions match requirements-ci.txt (tests/test_ci_requirements.py checks ruff),
## so a commit that passes these hooks passes CI's ruff check and ruff format.
##
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
